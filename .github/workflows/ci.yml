name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check for hardcoded secrets
        run: python scripts/check_no_secrets.py

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src/ecs

      - name: Unit and API tests
        env:
          SQL_CONNECTION_STRING: "Driver={ODBC Driver 18 for SQL Server};Server=localhost;Database=EmployeeCompensation;Trusted_Connection=yes;Encrypt=no;TrustServerCertificate=yes;"
        run: pytest tests/unit tests/api -q
